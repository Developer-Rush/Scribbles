<main>

  <!-- ===== Careers heading ===== -->
  <section class="section careers-hero">
    <div class="container">
      <div class="careers-heading-wrap reveal">
        <h1 class="careers-heading">Careers</h1>
      </div>
    </div>
  </section>

  <!-- ===== Application form ===== -->
  <section class="careers-form-section">
    <div class="container">
      <form class="careers-grid reveal" id="careers-application-form" name="careers-application-form">
        <input class="careers-field" type="text" name="First-Name" id="First-Name" placeholder="First Name" maxlength="256" required>
        <input class="careers-field" type="text" name="Last-Name" id="Last-Name" placeholder="Last Name" maxlength="256" required>
        <input class="careers-field" type="email" name="Email" id="Email" placeholder="Email" maxlength="256" required>
        <input class="careers-field" type="tel" name="Phone-Number" id="Phone-Number" placeholder="Phone Number" required>
        <input class="careers-field full-width" type="url" name="Upload-your-CV-Google-Drive-link" id="Upload-your-CV-Google-Drive-link" placeholder="Upload your CV (Google Drive link)" required>
        <button type="submit" class="careers-submit">
          <span class="button-text">Apply Now</span>
          <span class="button-background-color"></span>
        </button>
      </form>
      <div class="w-form-done" style="display:none;">Thank you! Your application has been received!</div>
      <div class="w-form-fail" style="display:none;">Oops! Something went wrong while submitting the form.</div>
    </div>
  </section>

</main>
